<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" font-family="Helvetica, Arial, sans-serif"><rect width="1200" height="1060" fill="#f6f5f1"/><text x="60" y="70" font-size="34" font-weight="700" fill="#111">studio-screen-connector</text><text x="60" y="104" font-size="18" fill="#555">One call, one window, one PNG. Read-only.</text><rect x="60" y="150" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="186" text-anchor="middle" font-size="22" font-weight="700">Agent</text><text x="600" y="214" text-anchor="middle" font-size="15" fill="#555">asks for a target: claude, unreal, blender</text><line x1="600.0" y1="244" x2="600.0" y2="282" stroke="#111" stroke-width="2"/><path d="M593.0,276 L600.0,286 L607.0,276" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="292" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="328" text-anchor="middle" font-size="22" font-weight="700">capture.ps1</text><text x="600" y="356" text-anchor="middle" font-size="15" fill="#555">one PowerShell call, no server, no daemon</text><line x1="600.0" y1="386" x2="600.0" y2="424" stroke="#111" stroke-width="2"/><path d="M593.0,418 L600.0,428 L607.0,418" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="434" width="528" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="324" y="470" text-anchor="middle" font-size="22" font-weight="700">allowlist.json</text><text x="324" y="498" text-anchor="middle" font-size="15" fill="#555">process name AND title regex</text><rect x="612" y="434" width="528" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="876" y="470" text-anchor="middle" font-size="22" font-weight="700">Denylist</text><text x="876" y="498" text-anchor="middle" font-size="15" fill="#555">password managers, banking, mail... refused</text><line x1="600.0" y1="528" x2="600.0" y2="566" stroke="#111" stroke-width="2"/><path d="M593.0,560 L600.0,570 L607.0,560" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="576" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="612" text-anchor="middle" font-size="22" font-weight="700">PrintWindow</text><text x="600" y="640" text-anchor="middle" font-size="15" fill="#555">PW_RENDERFULLCONTENT, no input sent</text><line x1="600.0" y1="670" x2="600.0" y2="708" stroke="#111" stroke-width="2"/><path d="M593.0,702 L600.0,712 L607.0,702" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="718" width="528" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="324" y="754" text-anchor="middle" font-size="22" font-weight="700">screens\&lt;target&gt;-&lt;time&gt;.png</text><text x="324" y="782" text-anchor="middle" font-size="15" fill="#555">stays on the PC, deleted after 24 h</text><rect x="612" y="718" width="528" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="876" y="754" text-anchor="middle" font-size="22" font-weight="700">capture-log.jsonl</text><text x="876" y="782" text-anchor="middle" font-size="15" fill="#555">title only, no pixels</text><line x1="600.0" y1="812" x2="600.0" y2="850" stroke="#111" stroke-width="2"/><path d="M593.0,844 L600.0,854 L607.0,844" fill="none" stroke="#111" stroke-width="2"/><rect x="60" y="860" width="1080" height="86" rx="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="600" y="896" text-anchor="middle" font-size="22" font-weight="700">CopyToBox</text><text x="600" y="924" text-anchor="middle" font-size="15" fill="#555">the agent pulls the path it was given</text><text x="60" y="1006" font-size="15" fill="#555">Source: README.md, capture.ps1. Full-screen capture is off by default.</text></svg>