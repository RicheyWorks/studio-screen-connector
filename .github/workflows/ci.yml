name: dry-run suites
on:
  push:
  pull_request:
jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pwsh version
        run: pwsh -v
      - name: contract + privacy + mutants (no Win32, no pixels)
        run: python -m harness.run_all --no-record
